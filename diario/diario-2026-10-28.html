:root {
  --bordo: #5d010b; --bordo2: #7a1324; --paper: #fcfbf8; --paper2: #f5f0e6; --ink: #1a1a1a; --ink2: #333333;
  --rule: #ddd3c2; --up: #17692f; --down: #b3261e;
  --serif: "Inter", "Helvetica Neue", Arial, sans-serif;          /* cuerpo: sans muy legible en el celular */
  --head: "SSerif", "Georgia", "Times New Roman", serif;           /* titulares y cabezal: serif moderna (Source Serif) */
  --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  --black: "SSerif", "Georgia", "Times New Roman", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #1f1f21; overscroll-behavior: none; }
body { font-family: var(--serif); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(ellipse at 50% 35%, #3a3a3d 0%, #1f1f21 70%); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#stage { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: center; }
#book { position: relative; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px;
  color: #ececec; font-family: var(--sans); font-weight: 600; font-size: 13px; letter-spacing: .04em; padding-bottom: env(safe-area-inset-bottom); }
#bar .ind { min-width: 104px; text-align: center; }
#bar .dots { display: flex; gap: 6px; }
#bar .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(236,236,236,.3); transition: background .3s, transform .3s; }
#bar .dots i.on { background: #ececec; transform: scale(1.25); }
.nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(236,236,236,.35); background: rgba(0,0,0,.18); color: #ececec;
  font-size: 20px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--head); }
.nav:disabled { opacity: .25; cursor: default; }
.side { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 28px; display: none; }
#sprev { left: 18px; } #snext { right: 18px; }
@media (min-width: 700px) { .side { display: flex; } }
#hint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none; display: flex; align-items: center; gap: 8px;
  background: rgba(26,26,26,.85); color: #fff; font-family: var(--sans); font-size: 14px; padding: 7px 14px 7px 12px;
  border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.3); transition: opacity .6s; white-space: nowrap; }
#hint .hand { display: inline-block; animation: swipe 1.6s ease-in-out infinite; font-style: normal; }
@keyframes swipe { 0% { transform: translateX(10px); opacity: 0 } 25% { opacity: 1 } 70% { transform: translateX(-12px); opacity: 1 } 100% { transform: translateX(-14px); opacity: 0 } }
#hint.off { opacity: 0; }

/* ---------- Páginas ---------- */
.page { background-color: var(--paper); overflow: hidden; }
.paper { position: absolute; inset: 0; overflow: hidden; color: var(--ink); background: var(--paper); }
.inner { position: absolute; inset: 0; padding: 1.0em 1.05em .7em; display: flex; flex-direction: column; overflow: hidden; }
.inner > * { flex-shrink: 0; }
.inner.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.grow { flex: 1 1 auto !important; min-height: .4em; }
b { font-weight: 700; }
.up-t { color: var(--up); font-weight: 700; white-space: nowrap; } .down-t { color: var(--down); font-weight: 700; white-space: nowrap; }
.rule2 { border-top: 3px double var(--ink); }
.rule { border-top: 1px solid var(--ink); }
.hair { border-top: 1px solid var(--rule); }
.kick { font-family: var(--sans); font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--bordo2); font-size: .66em; }

/* Encabezado de páginas internas */
.runhead { display: flex; align-items: baseline; justify-content: space-between; gap: .5em; padding-bottom: .25em; }
.runhead .mh { font-family: var(--black); font-weight: 900; letter-spacing: -.01em; font-size: 1.08em; color: var(--ink); white-space: nowrap; }
.runhead .rd { font-family: var(--sans); font-size: .6em; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); text-align: right; white-space: nowrap; }
.flag { margin-top: .45em; background: var(--bordo); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: .32em .6em .28em; }
.flag .t { font-family: var(--sans); font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: .78em; }
.flag .n { font-family: var(--sans); font-weight: 400; font-size: .68em; opacity: .85; }
.hl { font-family: var(--head); font-weight: 700; line-height: 1.1; letter-spacing: -.012em; color: var(--ink); }
.deck { font-family: var(--head); font-weight: 400; color: var(--ink2); line-height: 1.3; }
.sec-hl { font-size: 1.62em; margin-top: .3em; }
.sec-kick { margin-top: .6em; }
.sec-hl.long { font-size: 1.36em; }
.sec-deck { font-size: .98em; margin-top: .35em; }
.temas { font-family: var(--sans); font-size: .58em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin-top: .55em; padding: .35em 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); line-height: 1.5; }
.temas span + span::before { content: " · "; color: var(--bordo2); }

/* Recuadro de números */
.kbox { margin-top: .6em; border: 1px solid var(--ink); border-top: 3px solid var(--bordo); background: #fff; padding: .35em .5em .4em; }
.kbox .ttl { background: var(--paper2); margin: -.35em -.5em .3em; padding: .3em .5em;  font-family: var(--sans); font-weight: 800; font-size: .58em; letter-spacing: .14em; text-transform: uppercase; color: var(--bordo2); margin-bottom: .2em; }
.kgrid { display: grid; }
.kpi { padding: .2em .45em .15em; min-width: 0; }
.kgrid .kpi { border-left: 1px solid var(--rule); }
.kgrid .kpi.first { border-left: none; padding-left: 0; }
.kpi .l { font-family: var(--sans); font-size: .56em; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); line-height: 1.2; }
.kpi .v { font-family: var(--sans); font-weight: 800; letter-spacing: -.02em; font-size: 1.12em; line-height: 1.12; white-space: nowrap; overflow: hidden; color: var(--ink); font-variant-numeric: lining-nums; }
.kpi .d { font-family: var(--sans); font-size: .6em; font-weight: 800; }
.kpi.up .v, .kpi.up .d { color: var(--up); } .kpi.down .v, .kpi.down .d { color: var(--down); }
.arr { font-family: Arial, sans-serif; font-size: .62em; vertical-align: .18em; margin-right: .12em; }
.kgrid.rows2 .kpi.row2 { border-top: 1px solid var(--rule); margin-top: .15em; padding-top: .3em; }

/* Texto en columnas */
.cols { margin-top: .65em; column-gap: 1.1em; column-rule: 1px solid var(--rule); font-size: .84em; line-height: 1.42; color: var(--ink); text-align: left; hyphens: manual; -webkit-hyphens: manual; }
.cols.c2 { column-count: 2; }
.cols p { margin-bottom: .45em; text-indent: 0; }
.cols p b.lead { font-family: var(--sans); font-weight: 800; font-size: .74em; text-transform: uppercase; letter-spacing: .05em; color: var(--bordo2); }
.cols p.first::first-letter { font-family: var(--head); font-weight: 900; float: left; font-size: 3.1em; line-height: .8; margin: .06em .08em 0 0; color: var(--bordo); }
.cols p.first b.lead { font-size: 1em; text-transform: none; letter-spacing: 0; font-family: var(--serif); color: var(--ink); }

/* Agenda */
.agbox { margin-top: .5em; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); padding: .25em 0 .3em; }
.agbox .ttl { font-family: var(--sans); font-weight: 800; font-size: .58em; letter-spacing: .14em; text-transform: uppercase; color: var(--bordo2); margin-bottom: .15em; }
.agrow { display: grid; grid-template-columns: 6.6em 1fr; gap: .5em; font-size: .74em; line-height: 1.3; padding: .2em 0; border-top: 1px dotted var(--rule); }
.agrow:first-of-type { border-top: none; }
.agrow .w { font-family: var(--sans); font-weight: 800; font-size: .76em; text-transform: uppercase; letter-spacing: .04em; color: var(--bordo2); padding-top: .2em; }
.folio { display: flex; justify-content: space-between; font-family: var(--sans); font-size: .54em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); padding-top: .35em; border-top: 1px solid var(--ink); }

/* Tapa */
.ears { display: flex; align-items: center; justify-content: space-between; gap: .6em; }
.ears .logo, .colophon img { aspect-ratio: var(--logo-ar); width: auto; }
.ears .logo { height: 2.3em; display: block; border-radius: .12em; }
.ears .ear { font-family: var(--sans); font-size: .56em; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); text-align: right; line-height: 1.45; border: 1px solid var(--ink2); padding: .3em .6em; }
.ears .ear b { color: var(--bordo2); font-weight: 800; }
.mast { font-family: var(--black); font-weight: 900; letter-spacing: -.015em; text-align: center; color: var(--ink); white-space: nowrap; line-height: 1.05; margin-top: .2em; }
.dateline { display: flex; justify-content: space-between; align-items: center; font-family: var(--sans); font-size: .58em; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: .35em 0; border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); }
.dateline .c { color: var(--bordo2); font-weight: 800; }
.ticker { margin-top: .55em; border: 1px solid var(--ink); background: #fff; }
.ticker .ttl { background: var(--ink); color: var(--paper); font-family: var(--sans); font-weight: 800; font-size: .56em; letter-spacing: .16em; text-transform: uppercase; padding: .3em .7em; text-align: center; }
.ticker .kgrid { padding: .3em .45em .35em; }
.lead-story { margin-top: .6em; }
.lead-story .hl { font-size: 1.72em; margin-top: .15em; }
.lead-story .deck { font-size: 1em; margin-top: .3em; }
.lead-story .txt, .story .txt { font-size: .8em; line-height: 1.4; margin-top: .35em; text-align: left; hyphens: manual; -webkit-hyphens: manual; }
.pref { font-family: var(--sans); font-weight: 800; font-size: .7em; color: var(--bordo2); white-space: nowrap; letter-spacing: .04em; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .9em; margin-top: .55em; padding-top: .5em; border-top: 1px solid var(--ink); }
.two .story + .story { border-left: 1px solid var(--rule); padding-left: .9em; }
.story .hl { font-size: 1.08em; margin-top: .2em; }
.story .hl.long { font-size: .98em; }
.coverhint { text-align: center; font-size: .74em; color: var(--ink2); padding: .3em 0 .35em; }
.coverhint b { font-style: normal; color: var(--bordo2); }

/* Contratapa */
.ag-hl { font-size: 1.75em; margin-top: .35em; }
.agbig { margin-top: .5em; border-top: 2px solid var(--ink); }
.agbig .row { display: grid; grid-template-columns: 6.4em 1fr; gap: .7em; padding: .5em 0; border-bottom: 1px solid var(--rule); font-size: .9em; line-height: 1.32; }
.agbig .w { font-family: var(--sans); font-weight: 800; font-size: .7em; text-transform: uppercase; letter-spacing: .05em; color: var(--bordo2); padding-top: .25em; }
.agbig .w::before { content: ""; display: inline-block; width: .55em; height: .55em; background: var(--bordo); margin-right: .45em; vertical-align: .05em; }
.index { margin-top: .7em; }
.index .ttl { font-family: var(--sans); font-weight: 800; font-size: .58em; letter-spacing: .14em; text-transform: uppercase; color: var(--bordo2); padding-bottom: .2em; border-bottom: 1px solid var(--ink); }
.index .it { display: flex; align-items: baseline; gap: .4em; font-size: .84em; padding: .22em 0; }
.index .it .dl { flex: 1; border-bottom: 1px dotted var(--ink2); transform: translateY(-.25em); }
.index .it .p { font-family: var(--sans); font-weight: 800; font-size: .72em; color: var(--bordo2); }
.colophon { text-align: center; margin-top: .6em; }
.colophon img { height: 3.1em; border-radius: .12em; }
.colophon .mh { font-family: var(--black); font-weight: 900; font-size: 1.3em; margin-top: .2em; }
.disc { margin-top: .6em; border: 1px solid var(--ink); padding: .5em .7em .55em; background: var(--paper2); }
.disc .ttl { font-family: var(--sans); font-weight: 800; font-size: .58em; letter-spacing: .14em; text-transform: uppercase; color: var(--bordo2); margin-bottom: .2em; }
.disc p { font-size: .7em; line-height: 1.4; color: var(--ink2); }
.disc p.main { font-style: normal; font-weight: 700; color: var(--ink); font-size: .84em; margin-bottom: .25em; }
.fin { text-align: center; font-family: var(--head); font-size: .85em; color: var(--ink2); margin-top: .5em; }
.fin::before, .fin::after { content: " ✦ "; color: var(--bordo2); font-style: normal; font-size: .8em; }

.cue { position: absolute; left: 0; right: 0; bottom: 0; height: 3.2em; display: flex; align-items: flex-end; justify-content: center; padding-bottom: .35em;
  background: linear-gradient(rgba(252,251,248,0), var(--paper) 70%); font-family: var(--sans); font-weight: 700; font-size: 12px; color: var(--bordo2); pointer-events: none; transition: opacity .3s; }
.cue.off { opacity: 0; }
/* Página de prueba de medición (fuera de pantalla) */
#measure { position: fixed; left: -10000px; top: 0; }

/* ---------- Imagen OG 1200x630 ---------- */
body.og { overflow: hidden; background: #1f1f21; }
#og { width: 1200px; height: 630px; position: relative; overflow: hidden; display: none; }
body.og #og { display: block; }
body.og #stage, body.og #bar, body.og #hint, body.og .side { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<button class="nav side" id="sprev" aria-label="Página anterior">‹</button>
<button class="nav side" id="snext" aria-label="Página siguiente">›</button>
<div id="bar"><button class="nav" id="prev" aria-label="Página anterior">‹</button><div><div class="ind" id="ind"></div></div><div class="dots" id="dots"></div><button class="nav" id="next" aria-label="Página siguiente">›</button></div>

const LOGO_AR = "480 / 170";   /* ancho/alto del logo: se fija antes de que cargue la imagen para que la medición sea exacta */

function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\^\^(.+?)\^\^/g, '<span class="up-t">$1</span>')
    .replace(/__(.+?)__/g, '<span class="down-t">$1</span>');
}
function plain(s) { return String(s ?? "").replace(/\*\*|\^\^|__/g, ""); }
function cap(s) { s = s.trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
const arrow = k => k.dir === "up" ? '<span class="arr">▲</span>' : k.dir === "down" ? '<span class="arr">▼</span>' : "";

/* Párrafo con "cabeza" en negrita: separa "**Lead:** texto" */
function splitLead(t) {
  const m = /^\*\*(.+?)\*\*\s*(.*)$/s.exec(t.trim());
  if (!m) return { lead: "", rest: t };
  return { lead: m[1], rest: m[2] };
}
function para(t, first) {
  const { lead, rest } = splitLead(t);
  if (!lead) return `<p${first ? ' class="first"' : ""}>${fmt(t)}</p>`;
  let L = lead, R = rest;
  if (R.startsWith(":")) { L += ":"; R = R.slice(1).trimStart(); }
  return `<p${first ? ' class="first"' : ""}><b class="lead">${esc(L)}</b> ${fmt(R)}</p>`;
}

/* Titular automático a partir del primer ítem corto de la sección (se puede pisar con seccion.diario.titular / .bajada / .volanta) */
function headline(sec) {
  const o = sec.diario || {};
  const src = (sec.items && sec.items[0]) || (sec.slide && sec.slide.bullets && sec.slide.bullets[0]) || "";
  const { lead, rest } = splitLead(src);
  let kicker = "", hl = "", deck = "";
  let r = plain(rest).trim();
  const leadP = plain(lead).trim();
  if (leadP.endsWith(":") || r.startsWith(":")) {
    kicker = leadP.replace(/:$/, "");
    r = r.replace(/^:\s*/, "");
    hl = r;
  } else if (leadP) {
    const cut = r.search(/[:;]|\.\s/);
    hl = leadP + " " + (cut >= 0 ? r.slice(0, cut) : r);
    r = cut >= 0 ? r.slice(cut + 1) : "";
    deck = r.trim();
    hl = hl.trim();
    return { kicker: o.volanta ?? kicker, hl: cap(o.titular ?? hl).replace(/[.:;]\s*$/, ""), deck: o.bajada ?? (deck ? cap(deck) : "") };
  } else hl = r;
  // separar titular y bajada en el primer ". " / "; " / ", "
  let cut = hl.search(/;\s|\.\s/);
  if (cut < 0 && hl.length > 70) cut = hl.search(/,\s/);
  if (cut >= 0) { deck = hl.slice(cut + 1).trim(); hl = hl.slice(0, cut); }
  return { kicker: o.volanta ?? kicker, hl: cap(o.titular ?? hl).replace(/[.:;]\s*$/, ""), deck: o.bajada ?? (deck ? cap(deck) : "") };
}

function kgrid(kpis, cls = "") {
  const n = kpis.length;
  // 3 o menos: una fila; 4: 2x2; 5: 3+2; 6: 3+3
  let cols, spans;
  if (n <= 3) { cols = n; spans = kpis.map(() => 1); }
  else if (n === 4) { cols = 2; spans = [1,1,1,1]; }
  else { cols = 6; spans = kpis.map((_, i) => i < 3 ? 2 : (n === 5 ? 3 : 2)); }
  const perRow = n === 4 ? 2 : 3;
  return `<div class="kgrid ${n > 3 ? "rows2" : ""} ${cls}" style="grid-template-columns:repeat(${cols},1fr)">` + kpis.map((k, i) =>
    `<div class="kpi ${k.dir || ""} ${i % perRow === 0 || (n === 5 && i === 3) ? "first" : ""} ${i >= perRow ? "row2" : ""}" style="grid-column:span ${spans[i]}">
      <div class="l">${esc(k.label)}</div><div class="v">${arrow(k)}${esc(k.valor)}</div>${k.detalle ? `<div class="d">${esc(k.detalle)}</div>` : ""}</div>`).join("") + `</div>`;
}

const MAST = "El Diario de Sigma Capital";
function shortDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d.fecha_archivo || "");
  return m ? `${m[3]}/${m[2]}/${m[1]}` : d.fecha;
}
function runhead(d, pg, total) {
  return `<div class="runhead"><span class="mh">${MAST}</span><span class="rd">${esc(shortDate(d))} · Pág. ${pg}</span></div><div class="rule2"></div>`;
}
function folio(d, pg, total) {
  return `<div class="grow"></div><div class="folio"><span>Sigma Capital · ${esc(d.titulo || "Resumen de mercados")}</span><span>${pg} / ${total}</span></div>`;
}

function buildPages(d) {
  const secs = d.secciones || [];
  const total = secs.length + 2;
  const pages = [];
  // ---- Tapa ----
  const hls = secs.map(headline);
  let cover = `<div class="ears"><img class="logo" src="${LOGO}" alt="Sigma Capital"><div class="ear"><b>${esc(d.titulo || "Resumen de mercados")}</b><br>Edición diaria · ${total} páginas</div></div>
    <div class="mast fit-w">${MAST}</div>
    <div class="dateline"><span>${esc(d.fecha)}</span><span class="c">Informe diario</span></div>`;
  if (d.indicadores && d.indicadores.length)
    cover += `<div class="ticker"><div class="ttl">Los números del día</div>${kgrid(d.indicadores)}</div>`;
  if (secs[0]) {
    const h = hls[0], extra = (secs[0].items || []).slice(1, 2);
    cover += `<div class="lead-story"><div class="kick">${esc(secs[0].titulo)}${h.kicker ? " · " + esc(h.kicker) : ""}</div>
      <div class="hl">${esc(h.hl)}</div>${h.deck ? `<div class="deck">${esc(h.deck)}</div>` : ""}
      ${extra.map(t => `<div class="txt opt">${fmt(t)}</div>`).join("")}<div class="txt"><span class="pref">→ PÁG. 2</span></div></div>`;
  }
  if (secs.length > 1) {
    cover += `<div class="two">` + secs.slice(1, 3).map((s, j) => {
      const h = hls[j + 1];
      return `<div class="story"><div class="kick">${esc(s.titulo)}</div><div class="hl${h.hl.length > 90 ? " long" : ""}">${esc(h.hl)}</div>
        ${h.deck ? `<div class="txt opt">${esc(h.deck)}</div>` : ""}<div class="txt"><span class="pref">→ PÁG. ${j + 3}</span></div></div>`;
    }).join("") + `</div>`;
  }
  cover += `<div class="grow"></div><div class="coverhint rule2">Deslizá para pasar de hoja <b>→</b></div>`;
  pages.push(cover);
  // ---- Secciones ----
  secs.forEach((s, i) => {
    const sl = s.slide || {};
    const h = hls[i];
    const bullets = (sl.bullets && sl.bullets.length ? sl.bullets : s.items) || [];
    const temas = bullets.map(b => splitLead(b).lead).filter(Boolean).map(l => plain(l).replace(/:\s*$/, ""));
    let p = runhead(d, i + 2, total) +
      `<div class="flag"><span class="t">${esc(s.titulo)}</span><span class="n">Sección ${i + 1}</span></div>` +
      (h.kicker ? `<div class="kick sec-kick">${esc(h.kicker)}</div>` : "") +
      `<div class="hl sec-hl${h.hl.length > 80 ? " long" : ""}">${esc(h.hl)}</div>` +
      (temas.length > 1 ? `<div class="temas">${temas.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : "");
    if (sl.kpis && sl.kpis.length) p += `<div class="kbox"><div class="ttl">Los números</div>${kgrid(sl.kpis)}</div>`;
    p += `<div class="cols c2">${bullets.map((b, j) => para(b, j === 0)).join("")}</div>`;
    if (sl.agenda && sl.agenda.length)
      p += `<div class="agbox"><div class="ttl">Agenda</div>${sl.agenda.map(a => `<div class="agrow"><div class="w">${esc(a.cuando)}</div><div class="q">${fmt(a.que)}</div></div>`).join("")}</div>`;
    pages.push(p + folio(d, i + 2, total));
  });
  // ---- Contratapa ----
  const NOREC = "Material informativo, no constituye recomendación de inversión.";
  const foot = d.footer || "";
  const hasNoRec = /no constituye recomendaci[oó]n/i.test(foot);
  const footRest = foot.replace(/(Material informativo,?\s*)?no constituye recomendaci[oó]n de inversi[oó]n\.?/i, "").trim();
  let back = runhead(d, total, total) +
    `<div class="flag"><span class="t">Agenda del día</span><span class="n">Contratapa</span></div>
     <div class="hl ag-hl">Lo que viene</div>`;
  if (d.agenda && d.agenda.length)
    back += `<div class="agbig">${d.agenda.map(a => `<div class="row"><div class="w">${esc(a.cuando)}</div><div class="q">${fmt(a.que)}</div></div>`).join("")}</div>`;
  back += `<div class="index"><div class="ttl">En esta edición</div>${secs.map((s, i) => `<div class="it"><span>${esc(s.titulo)}</span><span class="dl"></span><span class="p">PÁG. ${i + 2}</span></div>`).join("")}</div>`;
  back += `<div class="grow"></div><div class="colophon"><img src="${LOGO}" alt="Sigma Capital"></div>
    <div class="disc"><div class="ttl">Aviso legal</div><p class="main">${hasNoRec ? "Este informe es material informativo y no constituye recomendación de inversión." : esc(NOREC)}</p>${footRest ? `<p>${esc(footRest)}</p>` : ""}</div>
    <div class="fin">Fin de la edición</div>` + folio(d, total, total);
  pages.push(back);
  return pages;
}


/* ---------- Guionado en español (guiones blandos) para que el texto justificado no deje "ríos" ---------- */
const VOW = "aeiouáéíóúü", STRONG = "aeoáéó";
const INSEP = new Set(["bl","br","cl","cr","dr","fl","fr","gl","gr","kl","kr","pl","pr","tr","tl"]);
function units(w) {           // letras -> unidades (ch, ll, rr, qu/gu ante e/i cuentan como una consonante)
  const u = [];
  for (let i = 0; i < w.length; ) {
    const two = w.slice(i, i + 2);
    if (["ch","ll","rr"].includes(two)) { u.push({t: two, v: false}); i += 2; continue; }
    if ((two === "qu" || two === "gu") && "eiéí".includes(w[i + 2] || "")) { u.push({t: two, v: false}); i += 2; continue; }
    u.push({t: w[i], v: VOW.includes(w[i])}); i++;
  }
  return u;
}
function hyphWord(word) {
  const w = word.toLowerCase();
  if (w.length < 6 || !/^[a-záéíóúüñ]+$/.test(w) || /[A-ZÁÉÍÓÚÑ]/.test(word.slice(1))) return word;
  const u = units(w), breaks = [];
  let i = 0; while (i < u.length && !u[i].v) i++;          // primer núcleo
  while (i < u.length) {
    let j = i; while (j + 1 < u.length && u[j + 1].v) {     // hiato dentro del grupo vocálico
      const a = u[j].t, b = u[j + 1].t;
      if ((STRONG.includes(a) && STRONG.includes(b)) || (STRONG.includes(a) && "íú".includes(b)) || ("íú".includes(a) && STRONG.includes(b))) breaks.push(j + 1);
      j++;
    }
    let k = j + 1; while (k < u.length && !u[k].v) k++;
    if (k >= u.length) break;                               // consonantes finales: sin corte
    const c = u.slice(j + 1, k).map(x => x.t), n = c.length;
    if (n === 1) breaks.push(j + 1);
    else if (n === 2) breaks.push(INSEP.has(c.join("")) ? j + 1 : j + 2);
    else if (n === 3) breaks.push(INSEP.has(c[1] + c[2]) ? j + 2 : j + 3);
    else if (n >= 4) breaks.push(j + 3);
    i = k;
  }
  let out = "", pos = 0, cuts = new Set();
  const starts = []; u.forEach(x => { starts.push(pos); pos += x.t.length; });
  breaks.forEach(b => { const at = starts[b]; if (at >= 2 && w.length - at >= 3) cuts.add(at); });
  for (let x = 0; x < word.length; x++) { if (cuts.has(x)) out += "\u00AD"; out += word[x]; }
  return out;
}
function hyphenate(root) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(t => { t.nodeValue = t.nodeValue.replace(/[A-Za-záéíóúüñÁÉÍÓÚÑ]+/g, hyphWord); });
}

/* ---------- Ajuste de contenido a la hoja ---------- */
function fitText(el, maxPx) {   // escala un texto de una línea al ancho disponible
  let fs = maxPx; el.style.fontSize = fs + "px";
  while (el.scrollWidth > el.clientWidth + 0.5 && fs > 8) { fs -= 0.5; el.style.fontSize = fs + "px"; }
}
function fitKpis(root) {
  root.querySelectorAll(".kpi .v").forEach(v => {
    v.style.fontSize = ""; let k = 1.22;
    while (v.scrollWidth > v.clientWidth + 0.5 && k > 0.75) { k -= 0.04; v.style.fontSize = k + "em"; }
  });
}
function fitPage(pg, base, W) {
  const inner = pg.querySelector(".inner");
  const cols = inner.querySelector(".cols");
  if (cols) cols.classList.toggle("c2", W >= 330);
  const over = () => inner.scrollHeight > inner.clientHeight + 1;
  const setK = k => {
    inner.style.fontSize = (base * k).toFixed(2) + "px";
    const m = inner.querySelector(".fit-w"); if (m) fitText(m, base * k * 2.35);
    fitKpis(inner);
  };
  let k = 1.12; setK(k);
  while (over() && k > 0.9) { k -= 0.02; setK(k); }
  if (over()) { inner.querySelectorAll(".opt").forEach(e => e.style.display = "none"); }   // 1º se quitan elementos opcionales (bajadas)
  while (over() && k > 0.84) { k -= 0.02; setK(k); }                                     // piso de legibilidad (~12px el cuerpo)
  if (over()) { inner.classList.add("scroll"); pg.querySelector(".paper").insertAdjacentHTML("beforeend", '<div class="cue">seguí leyendo ↓</div>'); }  // último recurso: scroll interno
  pg.dataset.k = k.toFixed(2); pg.dataset.scroll = over() ? "1" : "0";
}

/* ---------- Libro ---------- */
let flip = null, PAGES_HTML = [], cur = 0, lastW = 0;
const $ = id => document.getElementById(id);
function dims() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const barH = 50;
  const desktop = vw >= 700;
  let H = vh - barH - (desktop ? 28 : 8);
  let W = desktop ? Math.min(Math.round(H * 0.6), 560) : vw - 12;
  if (!desktop && H / W > 2.1) H = Math.round(W * 2.1);
  return { W: Math.round(W), H: Math.round(H), top: desktop ? 16 : 6, vh };
}
function build() {
  const { W, H, top, vh } = dims();
  lastW = window.innerWidth;
  if (flip) { cur = flip.getCurrentPageIndex(); try { flip.destroy(); } catch (e) {} flip = null; }
  const stage = $("stage");
  stage.innerHTML = "";
  stage.style.top = top + "px"; stage.style.height = H + "px";
  // contenedor de ancho fijo = 1 hoja: la librería usa width:100%, así siempre queda en modo "una hoja" (como un diario en la mano)
  const holder = document.createElement("div"); holder.style.width = W + "px"; holder.style.height = H + "px";
  const book = document.createElement("div"); book.id = "book"; book.style.width = W + "px"; book.style.height = H + "px";
  holder.appendChild(book); stage.appendChild(holder);
  // la letra depende del ancho; si la hoja es baja (navegador interno de WhatsApp) se achica un poco y, como último recurso, la hoja scrollea
  const base = Math.max(13.2, Math.min(17, 15.2 * Math.min(W / 378, Math.max(H / 770, 0.92))));
  // medir y ajustar cada hoja fuera de pantalla antes de entregarlas a la animación
  const meas = document.createElement("div"); meas.id = "measure"; document.body.appendChild(meas);
  const els = PAGES_HTML.map((h, i) => {
    const pg = document.createElement("div");
    pg.className = "page"; pg.dataset.density = "soft";
    pg.style.width = W + "px"; pg.style.height = H + "px"; pg.style.position = "relative";
    pg.innerHTML = `<div class="paper"><div class="inner">${h}</div></div>`;
    pg.querySelectorAll(".cols, .txt").forEach(hyphenate);
    meas.appendChild(pg); fitPage(pg, base, W);
    return pg;
  });
  els.forEach(e => book.appendChild(e));
  meas.remove();
  flip = new St.PageFlip(book, {
    width: W, height: H, size: "fixed", usePortrait: true, showCover: false, autoSize: true,
    drawShadow: true, maxShadowOpacity: 0.55, flippingTime: 850, mobileScrollSupport: true,
    swipeDistance: 25, showPageCorners: true, disableFlipByClick: false, startPage: Math.min(cur, els.length - 1),
  });
  flip.loadFromHTML(els);
  // Un gesto vertical (scroll dentro de una hoja que no entra) no debe interpretarse como "toque" que da vuelta la hoja
  const stop = flip.userStop.bind(flip);
  flip.userStop = (pos, isSwipe) => { if (vertical) { flip.isUserTouch = false; return; } stop(pos, isSwipe); };
  flip.on("flip", e => { cur = e.data; update(); hideHint(); });
  flip.on("changeState", e => { if (e.data === "user_fold" || e.data === "flipping") hideHint(); });
  $("hint").style.bottom = (vh - (top + H) + 12 + (vh - top - H > 60 ? 0 : 50)) + "px";
  $("bar").style.height = (vh - top - H) + "px";
  update();
}
function update() {
  const n = PAGES_HTML.length;
  $("ind").textContent = cur === 0 ? `Tapa · 1 de ${n}` : cur === n - 1 ? `Contratapa · ${n} de ${n}` : `Pág. ${cur + 1} de ${n}`;
  $("dots").innerHTML = PAGES_HTML.map((_, i) => `<i class="${i === cur ? "on" : ""}"></i>`).join("");
  $("prev").disabled = $("sprev").disabled = cur === 0;
  $("next").disabled = $("snext").disabled = cur === n - 1;
  if (history.replaceState) history.replaceState(null, "", "#p" + (cur + 1));
}
let hintTimer, t0 = null, vertical = false;
window.addEventListener("touchstart", e => { const t = e.touches[0]; t0 = { x: t.clientX, y: t.clientY }; vertical = false; }, { capture: true, passive: true });
window.addEventListener("touchmove", e => { if (!t0) return; const t = e.touches[0]; const dx = Math.abs(t.clientX - t0.x), dy = Math.abs(t.clientY - t0.y);
  if (dy > 12 && dy > dx * 1.2) vertical = true; }, { capture: true, passive: true });
document.addEventListener("scroll", e => { const el = e.target; if (!el.classList || !el.classList.contains("inner")) return;
  const c = el.parentNode.querySelector(".cue"); if (c) c.classList.toggle("off", el.scrollTop + el.clientHeight >= el.scrollHeight - 8); }, true);
function hideHint() { $("hint").classList.add("off"); clearTimeout(hintTimer); }
const next = () => flip && flip.flipNext("bottom"), prev = () => flip && flip.flipPrev("bottom");

/* ---------- Imagen para vista previa (og:image) ---------- */
function buildOG(d) {
  const secs = d.secciones || [], hls = secs.map(headline);
  const og = $("og");
  og.innerHTML = `<div class="paper"><div class="inner" style="font-size:23px;padding:24px 40px 22px">
    <div class="ears"><img class="logo" src="${LOGO}" style="height:62px"><div class="mast fit-w" style="flex:1;min-width:0;margin:0 .4em">${MAST}</div>
      <div class="ear"><b>${esc(d.titulo || "Resumen de mercados")}</b><br>Edición diaria</div></div>
    <div class="dateline" style="margin-top:.35em"><span>${esc(d.fecha)}</span><span class="c">Informe diario</span></div>
    <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:0 1.1em;margin-top:.1em">
      <div>${secs[0] ? `<div class="lead-story"><div class="kick">${esc(secs[0].titulo)}</div><div class="hl" style="font-size:1.75em">${esc(hls[0].hl)}</div>${hls[0].deck ? `<div class="deck" style="font-size:.82em">${esc(hls[0].deck)}</div>` : ""}</div>` : ""}
        ${secs.slice(1, 3).map((s, j) => `<div style="margin-top:.55em;padding-top:.4em;border-top:1px solid var(--rule)"><div class="kick">${esc(s.titulo)}</div><div class="hl" style="font-size:1.0em;margin-top:.15em">${esc(hls[j + 1].hl)}</div></div>`).join("")}</div>
      <div class="ticker" style="align-self:start;margin-top:.6em"><div class="ttl">Los números del día</div>${kgridList(d.indicadores || [])}</div>
    </div><div class="grow"></div>
    <div style="background:var(--bordo);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:.4em .8em;margin:0 -1.7em -1em;font-family:var(--sans);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.72em">
      <span>Tocá y pasá las hojas como en un diario</span><span style="font-family:var(--sans);letter-spacing:.02em;text-transform:none;font-weight:400">${(d.secciones || []).length + 2} páginas · Sigma Capital</span></div>
    </div></div>`;
  const m = og.querySelector(".fit-w"); m.style.overflow = "hidden"; fitText(m, 74);
}
function kgridList(kpis) {
  return `<div style="padding:.15em .7em .3em">` + kpis.map((k, i) => `<div class="kpi ${k.dir || ""}" style="display:flex;justify-content:space-between;align-items:baseline;padding:.32em 0;${i ? "border-top:1px solid var(--rule)" : ""}">
    <div class="l" style="font-size:.62em">${esc(k.label)}</div><div class="v" style="font-size:1.15em">${arrow(k)}${esc(k.valor)}${k.detalle ? ` <span class="d" style="font-size:.5em">${esc(k.detalle)}</span>` : ""}</div></div>`).join("") + `</div>`;
}

function start() {
  if (!DATA) return;
  document.documentElement.style.setProperty("--logo-ar", LOGO_AR);
  if (/[?&]og\b/.test(location.search)) { document.body.classList.add("og"); buildOG(DATA); document.body.dataset.ready = "1"; return; }
  PAGES_HTML = buildPages(DATA);
  const m = /#p(\d+)/.exec(location.hash); if (m) cur = Math.max(0, Math.min(PAGES_HTML.length - 1, +m[1] - 1));
  build();
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) { $("hintt").textContent = "tocá la hoja o usá las flechas ← →"; $("hint").querySelector(".hand").textContent = "👆"; }
  if (cur > 0) hideHint(); else hintTimer = setTimeout(hideHint, 6000);
  $("next").onclick = $("snext").onclick = next;
  $("prev").onclick = $("sprev").onclick = prev;
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
    // en el celular la barra del navegador cambia el alto todo el tiempo: sólo se rearma si cambia el ancho (rotación)
    if (Math.abs(window.innerWidth - lastW) > 2 || window.innerWidth >= 700) build();
  }, 250); });
  document.body.dataset.ready = "1";
}
// las fuentes incrustadas se cargan explícitamente antes de medir (si no, el ajuste se haría con la fuente de reemplazo)
(document.fonts ? Promise.all([...document.fonts].map(f => f.load().catch(() => null))).then(() => document.fonts.ready) : Promise.resolve())
  .then(start, start);
</script>
